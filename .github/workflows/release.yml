name: Firmware release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Run release tests
        run: python -m unittest discover -s tests -v

      - name: Build firmware
        run: pio run

      - name: Generate release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp .pio/build/mhetesp32minikit/firmware.bin dist/firmware-mhetesp32minikit.bin
          python scripts/generate_manifest.py \
            --firmware dist/firmware-mhetesp32minikit.bin \
            --output dist/manifest.json \
            --tag "$RELEASE_TAG" \
            --build "$GITHUB_SHA"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/firmware-mhetesp32minikit.bin
            dist/manifest.json
